name: CI (macOS + Windows + Linux)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-package:
    name: ${{ matrix.os }} (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.12"]
        exclude:
          - os: ubuntu-latest
            python-version: "3.11"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest

      - name: Compile check (warnings as errors)
        run: python -W error -m compileall -q src tests

      - name: Run full 22-Harness test suite
        env:
          PYTHONPATH: src
        run: python -m pytest -q -p no:cacheprovider tests

      - name: Build & verify native macOS Nexus Memory.app
        if: runner.os == 'macOS' && matrix.python-version == '3.12'
        run: |
          python packaging/macos/build_macos_app.py
          codesign --verify --deep --strict "dist/Nexus Memory.app"
          "dist/Nexus Memory.app/Contents/MacOS/nexus-memory-app" --self-test
          "dist/Nexus Memory.app/Contents/MacOS/nexus-memory-app" --cli matrix --from codex-cli --to antigravity

      - name: Build & smoke-test standalone Windows NexusMemory.exe
        if: runner.os == 'Windows' && matrix.python-version == '3.12'
        shell: pwsh
        run: |
          python -m pip install --upgrade pyinstaller
          python -m PyInstaller --clean --noconfirm packaging/windows/nexus_memory.spec
          Test-Path "dist/NexusMemory.exe"
          $out = & "dist/NexusMemory.exe" --self-test
          Write-Host "SELF-TEST: $out"
          if ($out -notmatch '"self_test": "ok"') { throw "Windows self-test failed: $out" }
          $mat = & "dist/NexusMemory.exe" --cli matrix --from codex-cli --to claude-code
          if ($mat -notmatch '"native_projection_plus_lossless_sidecar"') { throw "Windows CLI matrix failed" }
          python -c @"
          import json, subprocess, urllib.request
          p = subprocess.Popen(['dist/NexusMemory.exe', '--server-only'], stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True)
          try:
              line = p.stdout.readline()
              info = json.loads(line)
              assert info['ready'] is True, info
              with urllib.request.urlopen(info['url'] + 'api/health', timeout=10) as r:
                  assert r.status == 200
                  h = json.loads(r.read().decode('utf-8'))
                  assert h['ok'] is True
              with urllib.request.urlopen(info['url'], timeout=10) as r:
                  assert r.status == 200
                  html = r.read().decode('utf-8')
                  assert 'Nexus Memory' in html
              print('WINDOWS_EXE_LIVE_UI_SERVER_OK:', info['url'])
          finally:
              p.terminate()
              p.wait(timeout=5)
          "@
