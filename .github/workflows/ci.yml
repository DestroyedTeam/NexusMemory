name: CI (macOS + Windows + Linux)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-package:
    name: ${{ matrix.os }} (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.12"]
        exclude:
          - os: ubuntu-latest
            python-version: "3.11"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest

      - name: Compile check (warnings as errors)
        run: python -W error -m compileall -q src tests

      - name: Run full 25-Harness unit & N×N matrix test suite
        run: python -m pytest -q -p no:cacheprovider tests/test_prototype.py tests/test_nexus_v1.py tests/test_real_cli_binaries.py

      - name: Run headless Chromium Playwright GUI E2E suite
        if: matrix.python-version == '3.12'
        run: |
          python -m pip install playwright
          python -m playwright install chromium
          python -m pytest -q -p no:cacheprovider tests/test_gui_playwright_e2e.py

      - name: Build & install-test universal Debian .deb package
        if: runner.os == 'Linux' && matrix.python-version == '3.12'
        run: |
          python packaging/linux/build_deb.py
          DEB=$(ls dist/nexus-memory_*_all.deb)
          dpkg-deb --info "$DEB"
          dpkg-deb --contents "$DEB"
          sudo dpkg -i "$DEB"
          nexus-memory --version
          nexus-memory matrix --from codex-cli --to antigravity
          nexus-memory-desktop --self-test
          python -c '
          import json, subprocess, tempfile, time, urllib.request
          from pathlib import Path
          with tempfile.TemporaryDirectory() as td:
              ready_f = Path(td) / "ready.json"
              p = subprocess.Popen(["nexus-memory-desktop", "--server-only", "--ready-file", str(ready_f)])
              try:
                  deadline = time.time() + 15
                  while time.time() < deadline and not ready_f.is_file():
                      time.sleep(0.2)
                  assert ready_f.is_file(), "Debian server failed to emit ready.json"
                  info = json.loads(ready_f.read_text(encoding="utf-8"))
                  assert info["ready"] is True, info
                  with urllib.request.urlopen(info["url"] + "api/health", timeout=10) as r:
                      assert r.status == 200 and json.loads(r.read().decode("utf-8"))["ok"] is True
                  with urllib.request.urlopen(info["url"], timeout=10) as r:
                      assert r.status == 200 and "Nexus Memory" in r.read().decode("utf-8")
                  print("DEBIAN_DEB_LIVE_UI_SERVER_OK:", info["url"])
              finally:
                  p.terminate()
                  p.wait(timeout=5)
          '

      - name: Build & verify native macOS Nexus Memory.app
        if: runner.os == 'macOS' && matrix.python-version == '3.12'
        run: |
          python packaging/macos/build_macos_app.py
          codesign --verify --deep --strict "dist/Nexus Memory.app"
          "dist/Nexus Memory.app/Contents/MacOS/nexus-memory-app" --self-test
          "dist/Nexus Memory.app/Contents/MacOS/nexus-memory-app" --cli matrix --from codex-cli --to antigravity

      - name: Build & smoke-test standalone Windows NexusMemory.exe
        if: runner.os == 'Windows' && matrix.python-version == '3.12'
        shell: pwsh
        run: |
          python -m pip install --upgrade pyinstaller
          python -m PyInstaller --clean --noconfirm packaging/windows/nexus_memory.spec
          if (!(Test-Path "dist/NexusMemory.exe")) { throw "Missing dist/NexusMemory.exe" }
          python -c @"
          import json, subprocess, tempfile, time, urllib.request
          from pathlib import Path
          with tempfile.TemporaryDirectory() as td:
              t = Path(td)
              st_out = t / 'selftest.json'
              subprocess.run(['dist/NexusMemory.exe', '--self-test', '--out-file', str(st_out)], timeout=30, check=True)
              st = json.loads(st_out.read_text(encoding='utf-8'))
              print('WINDOWS_SELF_TEST:', st)
              assert st['self_test'] == 'ok'

              mat_out = t / 'matrix.json'
              subprocess.run(['dist/NexusMemory.exe', '--out-file', str(mat_out), '--cli', 'matrix', '--from', 'codex-cli', '--to', 'antigravity'], timeout=30, check=True)
              mat = json.loads(mat_out.read_text(encoding='utf-8'))
              assert mat['overall_mode'] == 'native_projection_plus_lossless_sidecar'

              ready_f = t / 'ready.json'
              p = subprocess.Popen(['dist/NexusMemory.exe', '--server-only', '--ready-file', str(ready_f)])
              try:
                  deadline = time.time() + 20
                  while time.time() < deadline and not ready_f.is_file():
                      time.sleep(0.2)
                  assert ready_f.is_file(), 'Windows server failed to emit ready.json'
                  info = json.loads(ready_f.read_text(encoding='utf-8'))
                  assert info['ready'] is True, info
                  with urllib.request.urlopen(info['url'] + 'api/health', timeout=10) as r:
                      assert r.status == 200 and json.loads(r.read().decode('utf-8'))['ok'] is True
                  with urllib.request.urlopen(info['url'], timeout=10) as r:
                      assert r.status == 200 and 'Nexus Memory' in r.read().decode('utf-8')
                  print('WINDOWS_EXE_LIVE_UI_SERVER_OK:', info['url'])
              finally:
                  p.terminate()
                  p.wait(timeout=5)
          "@
