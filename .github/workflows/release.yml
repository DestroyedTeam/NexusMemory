name: Release (macOS .app + Windows .exe + Debian .deb + Agent Skill)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest
      - run: python -W error -m compileall -q src tests
      - env:
          PYTHONPATH: src
        run: python -m pytest -q -p no:cacheprovider tests

  build-macos:
    needs: verify
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build native Swift macOS Nexus Memory.app
        run: |
          python packaging/macos/build_macos_app.py
          codesign --verify --deep --strict "dist/Nexus Memory.app"
          "dist/Nexus Memory.app/Contents/MacOS/nexus-memory-app" --self-test
          mkdir -p release-assets
          ditto -c -k --sequesterRsrc --keepParent "dist/Nexus Memory.app" "release-assets/Nexus-Memory-macOS-arm64.zip"
          (cd release-assets && shasum -a 256 Nexus-Memory-macOS-arm64.zip > SHA256SUMS-macos.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: macos-bundle
          path: release-assets/*

  build-windows:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build & smoke-test standalone Windows NexusMemory.exe
        shell: pwsh
        run: |
          python -m pip install --upgrade pip pyinstaller
          python -m PyInstaller --clean --noconfirm packaging/windows/nexus_memory.spec
          python -c @"
          import json, subprocess, tempfile, time, urllib.request
          from pathlib import Path
          with tempfile.TemporaryDirectory() as td:
              t = Path(td)
              st_out = t / 'selftest.json'
              subprocess.run(['dist/NexusMemory.exe', '--self-test', '--out-file', str(st_out)], timeout=30, check=True)
              assert json.loads(st_out.read_text(encoding='utf-8'))['self_test'] == 'ok'
              mat_out = t / 'matrix.json'
              subprocess.run(['dist/NexusMemory.exe', '--out-file', str(mat_out), '--cli', 'matrix', '--from', 'codex-cli', '--to', 'antigravity'], timeout=30, check=True)
              assert json.loads(mat_out.read_text(encoding='utf-8'))['overall_mode'] == 'native_projection_plus_lossless_sidecar'
              ready_f = t / 'ready.json'
              p = subprocess.Popen(['dist/NexusMemory.exe', '--server-only', '--ready-file', str(ready_f)])
              try:
                  deadline = time.time() + 20
                  while time.time() < deadline and not ready_f.is_file():
                      time.sleep(0.2)
                  assert ready_f.is_file(), 'Windows server failed to emit ready.json'
                  info = json.loads(ready_f.read_text(encoding='utf-8'))
                  assert info['ready'] is True
                  with urllib.request.urlopen(info['url'] + 'api/health', timeout=10) as r:
                      assert r.status == 200
                  print('WINDOWS_RELEASE_SMOKE_OK')
              finally:
                  p.terminate()
                  p.wait(timeout=5)
          "@
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Copy-Item "dist/NexusMemory.exe" "release-assets/NexusMemory-Windows-x64.exe"
          Compress-Archive -Path "dist/NexusMemory.exe" -DestinationPath "release-assets/NexusMemory-Windows-x64.zip" -Force
          $h1 = (Get-FileHash "release-assets/NexusMemory-Windows-x64.exe" -Algorithm SHA256).Hash.ToLower()
          $h2 = (Get-FileHash "release-assets/NexusMemory-Windows-x64.zip" -Algorithm SHA256).Hash.ToLower()
          [System.IO.File]::WriteAllText((Join-Path (Get-Location) "release-assets/SHA256SUMS-windows.txt"), "$h1  NexusMemory-Windows-x64.exe`n$h2  NexusMemory-Windows-x64.zip`n")
      - uses: actions/upload-artifact@v4
        with:
          name: windows-bundle
          path: release-assets/*

  build-deb:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build & verify universal Debian/Ubuntu .deb package
        run: |
          python packaging/linux/build_deb.py
          mkdir -p release-assets
          DEB=$(ls dist/nexus-memory_*_all.deb)
          dpkg-deb --info "$DEB"
          sudo dpkg -i "$DEB"
          nexus-memory --version
          nexus-memory-desktop --self-test
          cp "$DEB" release-assets/
          (cd release-assets && sha256sum nexus-memory_*_all.deb > SHA256SUMS-linux.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: linux-deb-bundle
          path: release-assets/*

  build-skill:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package self-contained Cross-Harness Agent Skill
        run: |
          mkdir -p /tmp/skill-stage/nexus-memory release-assets
          cp -R skills/nexus-memory/* /tmp/skill-stage/nexus-memory/
          mkdir -p /tmp/skill-stage/nexus-memory/lib
          cp -R src/nexus_memory /tmp/skill-stage/nexus-memory/lib/nexus_memory
          chmod +x /tmp/skill-stage/nexus-memory/scripts/run_nexus.sh
          (cd /tmp/skill-stage && zip -rq "$GITHUB_WORKSPACE/release-assets/nexus-memory-skill.zip" nexus-memory)
          sha256sum release-assets/nexus-memory-skill.zip | sed 's|release-assets/||' > release-assets/SHA256SUMS-skill.txt
      - uses: actions/upload-artifact@v4
        with:
          name: skill-bundle
          path: release-assets/*

  publish:
    needs: [build-macos, build-windows, build-deb, build-skill]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Merge SHA256SUMS
        run: |
          cat artifacts/SHA256SUMS-*.txt > artifacts/SHA256SUMS.txt
          rm -f artifacts/SHA256SUMS-*.txt
          ls -la artifacts
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/Nexus-Memory-macOS-arm64.zip
            artifacts/NexusMemory-Windows-x64.exe
            artifacts/NexusMemory-Windows-x64.zip
            artifacts/nexus-memory_*_all.deb
            artifacts/nexus-memory-skill.zip
            artifacts/SHA256SUMS.txt
